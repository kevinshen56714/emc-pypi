name: Test and publish EMC

on:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - name: Set EMC executable permissions
        run: chmod 0755 pyemc/emc/bin/emc_*
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Run the installed wheel from a path containing spaces
        shell: bash
        run: |
          python -m venv "EMC test environment"
          python_bin="EMC test environment/${{ runner.os == 'Windows' && 'Scripts' || 'bin' }}/python"
          "$python_bin" -m pip install --no-deps dist/*.whl
          "$python_bin" -I .github/emc/smoke.py
      - name: Run the installed wheel from PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& ".\EMC test environment\Scripts\python.exe" -I .github/emc/smoke.py'

  publish:
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install twine
      - run: python -m twine upload dist/*
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
